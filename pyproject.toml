[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "child-mortality-analysis"
version = "1.0.0"
description = "Reproducible ecological analysis of under-five mortality using World Bank data"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "statsmodels>=0.14,<0.16", "matplotlib>=3.8,<4", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["child_mortality*"]
